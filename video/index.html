<!doctype html>
<html lang="ko" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="lib/base.css" />
    <style>
      @font-face { font-family: 'Pretendard'; src: url('lib/fonts/PretendardVariable.woff2') format('woff2'); font-weight: 45 920; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1F4A36; }
      #stage { --sans: 'Pretendard', system-ui, sans-serif; --display: 'Pretendard', system-ui, sans-serif; position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- One episode per page. The scene list below is the timeline; data-duration must equal its total. -->
    <div id="stage" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080"></div>
    <script>
      // HyperFrames waits for this before the first seek (fonts and scene setup are async)
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.scenes = new Promise(r => { window.__scenesReady = r; });
    </script>
    <script src="lib/gsap.min.js"></script>
    <script src="figures/core.js"></script>
    <script src="figures/server-fig.js"></script>
    <script src="figures/export.js"></script>
    <script src="lib/kit.js"></script>
    <script src="lib/shared.js"></script>
    <script type="module">
      import './scenes/srv.js';
      await document.fonts.load('800 40px Pretendard');
      const total = window.play([{ id: 'srv', dur: 12 }], document.getElementById('stage'));
      // ponytail: an empty paused timeline only gives HyperFrames the length; scenes draw on 'hf-seek'
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true }).set({}, {}, total);
      window.__scenesReady();
    </script>
  </body>
</html>
